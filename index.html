body::before {
  content: '';
  position: fixed; inset: 0;
  background: rgba(13,15,20,0.88);
  z-index: 0;
}

header, .shell, #login-screen { position: relative; z-index: 2; }

/* ════ LOGIN ════ */
#login-screen {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: rgba(10,12,18,0.96);
}

.login-wrap {
  width: 780px; max-width: 96vw;
  display: flex;
  background: var(--card);
  border: 1px solid var(--border3);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 32px 80px rgba(0,0,0,0.6);
}

.login-left {
  width: 260px; flex-shrink: 0;
  background: var(--bg3);
  border-right: 1px solid var(--border2);
  padding: 2.5rem 2rem;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 12px;
}

.login-shield {
  width: 64px; height: 64px; border-radius: 50%;
  background: linear-gradient(135deg, #1a2a4a, #0d1a30);
  border: 2px solid rgba(74,158,255,0.4);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 4px;
  box-shadow: 0 0 24px rgba(74,158,255,0.15);
}

.login-left h2 { font-size: 18px; font-weight: 700; color: #fff; letter-spacing: .01em; }
.login-left p  { font-size: 12px; color: var(--text2); line-height: 1.6; }

.login-tag {
  font-family: var(--mono); font-size: 10px;
  color: var(--blue); letter-spacing: .12em;
  background: rgba(74,158,255,0.1);
  border: 1px solid rgba(74,158,255,0.25);
  padding: 3px 10px; border-radius: 20px;
  margin-top: 4px;
}

.login-right {
  flex: 1; padding: 2.5rem 2rem;
  display: flex; flex-direction: column; gap: 1rem;
  background: var(--card);
}

.login-right h3 {
  font-size: 11px; font-weight: 600;
  color: var(--text2); letter-spacing: .1em; text-transform: uppercase;
  margin-bottom: 4px;
}

.lf { display: flex; flex-direction: column; gap: 6px; }
.lf label { font-size: 11px; font-weight: 500; color: var(--text2); }

.lf input, .lf select {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text); font-family: var(--sans); font-size: 13px;
  padding: 9px 12px; outline: none;
  transition: border-color .15s, box-shadow .15s;
  appearance: none; -webkit-appearance: none; width: 100%;
}
.lf input:focus, .lf select:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(74,158,255,0.12);
}
.lf input::placeholder { color: var(--text3); }
.lf .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.login-btn {
  width: 100%; padding: 11px;
  background: var(--blue); border: none; border-radius: var(--radius-sm);
  color: #fff; font-family: var(--sans); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background .15s; letter-spacing: .01em;
}
.login-btn:hover { background: #3a8ef0; }

.auto-label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.auto-label input[type=checkbox] { accent-color: var(--blue); width: 14px; height: 14px; }
.auto-label span { font-size: 12px; color: var(--text2); }
#login-error { font-size: 12px; color: var(--red); display: none; }

/* ════ SHELL ════ */
.shell { display: none; flex-direction: column; height: 100vh; }

/* TOPBAR */
.topbar {
  height: 52px; flex-shrink: 0;
  background: rgba(19,22,30,0.98);
  border-bottom: 1px solid var(--border2);
  display: flex; align-items: center; padding: 0 1.25rem; gap: 12px;
  backdrop-filter: blur(8px);
}

.topbar-logo {
  display: flex; align-items: center; gap: 8px;
}
.topbar-logo .logo-icon {
  width: 28px; height: 28px; border-radius: 6px;
  background: linear-gradient(135deg, #1a3a6a, #0d2040);
  border: 1px solid rgba(74,158,255,0.3);
  display: flex; align-items: center; justify-content: center;
}
.topbar-logo .logo-text {
  font-size: 14px; font-weight: 700; color: #fff; letter-spacing: .04em;
}
.topbar-logo .logo-sub {
  font-size: 11px; color: var(--text2); margin-left: 2px;
}

.topbar-sep { width: 1px; height: 20px; background: var(--border2); }

.online-pill {
  display: flex; align-items: center; gap: 5px;
  background: rgba(63,185,80,0.1);
  border: 1px solid rgba(63,185,80,0.25);
  border-radius: 20px; padding: 3px 10px;
  font-size: 10px; font-weight: 600; color: var(--green2); letter-spacing: .08em;
}
.online-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green2); box-shadow: 0 0 5px var(--green2);
  animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.35} }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.user-card {
  display: flex; align-items: center; gap: 9px;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 8px; padding: 5px 12px 5px 7px;
}
.user-avatar {
  width: 28px; height: 28px; border-radius: 6px;
  background: linear-gradient(135deg, var(--blue), #1a5ab0);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
}
.user-info { display: flex; flex-direction: column; }
.user-name { font-size: 13px; font-weight: 600; color: #fff; line-height: 1.2; }
.user-rank { font-size: 10px; color: var(--blue2); line-height: 1.2; }

.logout-btn {
  background: transparent; border: 1px solid var(--border2);
  color: var(--text2); font-size: 11px; font-family: var(--sans);
  padding: 6px 12px; border-radius: var(--radius-sm);
  cursor: pointer; transition: all .15s; font-weight: 500;
}
.logout-btn:hover { border-color: var(--border3); color: var(--text); }

/* MAIN */
.main { display: flex; flex: 1; overflow: hidden; padding: 1rem; gap: 1rem; }

/* SIDEBAR */
.sidebar {
  width: 185px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 4px;
  overflow-y: auto;
}

.sidebar-section {
  font-size: 10px; font-weight: 600; color: var(--text3);
  letter-spacing: .1em; text-transform: uppercase;
  padding: 0 6px; margin: 8px 0 4px;
}
.sidebar-section:first-child { margin-top: 0; }

.tab {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border: none; border-radius: var(--radius-sm);
  background: transparent; color: var(--text2);
  font-family: var(--sans); font-size: 12px; font-weight: 400;
  cursor: pointer; text-align: left; transition: all .12s; width: 100%;
}
.tab:hover { background: var(--bg3); color: var(--text); }
.tab.active { background: rgba(74,158,255,0.12); color: var(--blue2); font-weight: 500; border-left: 2px solid var(--blue); padding-left: 8px; }
.tab.active-notes { background: rgba(232,184,75,0.1); color: var(--gold2); font-weight: 500; border-left: 2px solid var(--gold); padding-left: 8px; }

.tab-num { font-family: var(--mono); font-size: 9px; color: var(--text3); min-width: 16px; }
.tab.active .tab-num { color: var(--blue); }
.tab.active-notes .tab-num { color: var(--gold); }

.tab-notes-icon { font-size: 13px; }

/* CONTENT AREA */
.content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; gap: 0; }

/* DOCUMENT CARD */
.doc-card {
  flex: 1; display: flex; flex-direction: column;
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  overflow: hidden;
}

.doc-header {
  padding: 1rem 1.25rem 0.75rem;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  background: var(--card2);
}

.doc-icon {
  width: 32px; height: 32px; border-radius: 7px;
  background: rgba(74,158,255,0.12);
  border: 1px solid rgba(74,158,255,0.2);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.doc-title { font-size: 14px; font-weight: 600; color: #fff; }
.doc-badge {
  font-family: var(--mono); font-size: 10px; color: var(--text3);
  background: var(--bg3); border: 1px solid var(--border2);
  padding: 2px 8px; border-radius: 4px; margin-left: 2px;
}

.doc-body {
  flex: 1; overflow-y: auto; padding: 1.25rem;
}

.template-box {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 1.2rem 1.4rem;
  font-family: var(--mono); font-size: 13px; color: var(--text);
}

.line { display: flex; align-items: baseline; min-height: 26px; flex-wrap: wrap; }
.spacer { height: 10px; width: 100%; flex-shrink: 0; }
.line-label { color: var(--text); white-space: pre; font-family: var(--mono); font-size: 13px; line-height: 1; }
.static { color: var(--text); font-family: var(--mono); font-size: 13px; line-height: 1.75; padding: 1px 0; width: 100%; }

.f {
  background: transparent; border: none;
  border-bottom: 1px solid rgba(74,158,255,0.35);
  color: var(--blue2); font-family: var(--mono); font-size: 13px;
  padding: 0 3px 1px; outline: none; min-width: 60px; flex: 1;
  transition: border-color .15s; line-height: 1;
}
.f:focus { border-bottom-color: var(--blue); background: rgba(74,158,255,0.05); }
.f::placeholder { color: rgba(74,158,255,0.28); font-style: italic; }

.fa {
  display: block; width: 100%;
  background: rgba(74,158,255,0.04);
  border: none; border-left: 2px solid rgba(74,158,255,0.25);
  color: var(--blue2); font-family: var(--mono); font-size: 13px;
  padding: 5px 0 5px 10px; margin: 3px 0; outline: none;
  resize: none; min-height: 38px; line-height: 1.75;
  transition: border-color .15s; overflow: hidden;
  border-radius: 0 4px 4px 0;
}
.fa:focus { border-left-color: var(--blue); background: rgba(74,158,255,0.07); }
.fa::placeholder { color: rgba(74,158,255,0.25); font-style: italic; }

/* NOTES PANEL */
.notes-card {
  flex: 1; display: flex; flex-direction: column;
  background: var(--card);
  border: 1px solid rgba(232,184,75,0.2);
  border-radius: var(--radius);
  overflow: hidden;
}

.notes-header {
  padding: 1rem 1.25rem 0.75rem;
  border-bottom: 1px solid rgba(232,184,75,0.12);
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
  background: var(--card2);
}

.notes-icon {
  width: 32px; height: 32px; border-radius: 7px;
  background: rgba(232,184,75,0.1);
  border: 1px solid rgba(232,184,75,0.25);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; font-size: 15px;
}

.notes-title { font-size: 14px; font-weight: 600; color: #fff; }
.notes-hint { font-size: 11px; color: var(--text3); margin-left: auto; }

.notes-body { flex: 1; padding: 1rem; display: flex; flex-direction: column; gap: 8px; }

.notes-textarea {
  flex: 1; width: 100%; min-height: 200px;
  background: var(--bg3);
  border: 1px solid var(--border2); border-radius: var(--radius-sm);
  color: var(--text); font-family: var(--mono); font-size: 13px;
  padding: 12px; outline: none; resize: none; line-height: 1.75;
  transition: border-color .15s;
}

.notes-actions { display: flex; gap: 8px; }

}

<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-wrap">

      <div class="login-shield">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none">

      </div>

    </div>
    <div class="login-right">
      <h3>Přihlášení</h3>
      <div class="lf">
        <label>Hodnost</label>

          <option>Detective III</option>

      <button class="login-btn" onclick="doLogin()">Přihlásit se</button>

</div>

<!-- SHELL -->
<div class="shell" id="shell">
  <div class="topbar">
    <div class="topbar-logo">
      <div class="logo-icon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 1.5L2 4v4c0 3.8 2.6 7.3 6 8 3.4-.7 6-4.2 6-8V4L8 1.5z" fill="rgba(74,158,255,0.2)" stroke="#4a9eff" stroke-width="1.2"/>
        </svg>
      </div>
      <span class="logo-text">SASP</span>
      <span class="logo-sub">Terminal</span>
    </div>
    <div class="topbar-sep"></div>

    <div class="topbar-right">

  <div class="main">

      <button class="tab" onclick="setTab(1)"><span class="tab-num">02</span>Podmíněný trest</button>
      <button class="tab" onclick="setTab(2)"><span class="tab-num">03</span>Souhlas se zadržením</button>
      <button class="tab" onclick="setTab(3)"><span class="tab-num">04</span>Ozbrojená loupež</button>
      <button class="tab" onclick="setTab(4)"><span class="tab-num">05</span>Drogy (10-14)</button>
      <button class="tab" onclick="setTab(5)"><span class="tab-num">06</span>Přepadení osob</button>
      <button class="tab" onclick="setTab(6)"><span class="tab-num">07</span>Výslech osoby</button>
      <button class="tab" onclick="setTab(7)"><span class="tab-num">08</span>Uzavření dálnice</button>
      <button class="tab" onclick="setTab(8)"><span class="tab-num">09</span>Uzavření oblasti</button>

<script>
let currentUser = { rank:'', fname:'', lname:'' };
function fullName() { return currentUser.fname + ' ' + currentUser.lname; }
function signatureLine() { return currentUser.rank + ' ' + currentUser.fname + ' ' + currentUser.lname; }

function doLogin() {
  const rank = document.getElementById('login-rank').value;
  const fname = document.getElementById('login-fname').value.trim();
  const lname = document.getElementById('login-lname').value.trim();
  const err = document.getElementById('login-error');
  if (!rank || !fname || !lname) { err.style.display = 'block'; return; }
  err.style.display = 'none';
  currentUser = { rank, fname, lname };
  if (document.getElementById('autologin-cb').checked) {
    localStorage.setItem('sasp_user', JSON.stringify(currentUser));
  } else {
    localStorage.removeItem('sasp_user');
  }
  showApp();
}

function doLogout() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('shell').style.display = 'none';
  document.getElementById('login-rank').value = currentUser.rank || '';
  document.getElementById('login-fname').value = currentUser.fname || '';
  document.getElementById('login-lname').value = currentUser.lname || '';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  const shell = document.getElementById('shell');
  shell.style.display = 'flex';
  const i = (currentUser.fname[0]||'') + (currentUser.lname[0]||'');
  document.getElementById('user-avatar').textContent = i.toUpperCase();
  document.getElementById('user-name').textContent = fullName();
  document.getElementById('user-rank').textContent = currentUser.rank;
  const saved = localStorage.getItem('sasp_notes');
  if (saved) document.getElementById('notes-area').value = saved;
  setTab(0);
}

window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('sasp_user');
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      document.getElementById('login-rank').value = currentUser.rank;
      document.getElementById('login-fname').value = currentUser.fname;
      document.getElementById('login-lname').value = currentUser.lname;
      document.getElementById('autologin-cb').checked = true;
      showApp();
    } catch(e) { localStorage.removeItem('sasp_user'); }
  }
});

// Notes
let notesSaveTimer;
function saveNotes() {
  clearTimeout(notesSaveTimer);
  notesSaveTimer = setTimeout(() => {
    localStorage.setItem('sasp_notes', document.getElementById('notes-area').value);
    const s = document.getElementById('notes-saved');
    s.style.display = 'inline';
    setTimeout(() => s.style.display = 'none', 1500);
  }, 600);
}

function copyNotes() {
  navigator.clipboard.writeText(document.getElementById('notes-area').value);
}

function clearNotes() {
  if (confirm('Opravdu smazat všechny zápisky?')) {
    document.getElementById('notes-area').value = '';
    localStorage.removeItem('sasp_notes');
  }
}

function showNotes() {
  document.getElementById('doc-view').style.display = 'none';
  document.getElementById('notes-view').style.display = 'flex';
  document.querySelectorAll('.tab').forEach(t => { t.classList.remove('active'); t.classList.remove('active-notes'); });
  document.getElementById('tab-notes').classList.add('active-notes');
}

// Templates
function L(label, placeholder, width) {
  return `<div class="line"><span class="line-label">${label}</span><input class="f" placeholder="${placeholder}" style="min-width:${width||120}px"></div>`;
}
const SP = `<div class="spacer"></div>`;
function S(text) { return `<div class="static">${text}</div>`; }
function TA(label, placeholder, rows) {
  const h = (rows||2)*22+12;
  return `<div class="static">${label}</div><textarea class="fa" placeholder="${placeholder}" style="min-height:${h}px" oninput="autoResize(this)"></textarea>`;
}
function SIG() {
  return `<div class="static">Děkuji,</div><div class="static">S pozdravem</div><div class="static">${signatureLine()}</div>`;
}

const templates = [
  { name:"Nesouhlas s trestem", code:"DOC-01", html: () => [
    S(`Vážený @Soudce / @Statni zastupce tímto žádám o vyjádření k rozhodnutí ve věci zkráceného řízení:`),SP,
    `<div class="line"><span class="line-label">Osoba </span><input class="f" placeholder="Jméno Příjmení" style="min-width:160px"><span class="line-label"> DOB: </span><input class="f" placeholder="DD.MM.YYYY" style="min-width:100px"><span class="line-label"> nesouhlasí s rozhodnutím státní ozbrojené složky ve věci zkráceného řízení pro </span><input class="f" placeholder="trestný čin" style="min-width:120px"></div>`,SP,
    `<div class="line"><span class="line-label">Výše uvedený(á) dne </span><input class="f" placeholder="datum" style="min-width:90px"><span class="line-label"> kolem </span><input class="f" placeholder="čas" style="min-width:60px"><span class="line-label"> </span><input class="f" placeholder="popis jednání osoby" style="min-width:300px"></div>`,SP,
    TA('Důvod nesouhlasu s trestem:','Napište důvod nesouhlasu...'),SP,
    TA('Důkazní prostředky:','Napište důkazy...'),SP,
    `<div class="line"><span class="line-label">Výpis z rejstříku trestů: Výše uvedený byl již </span><input class="f" placeholder="počet" style="min-width:45px"><span class="line-label">x trestán pro </span><input class="f" placeholder="trestný čin" style="min-width:150px"></div>`,SP,
    SIG(),
  ].join('') },
  { name:"Podmíněný trest", code:"DOC-02", html: () => [
    S(`Vážený @Soudce @Statni zastupce @Captain`),SP,
    `<div class="line"><span class="line-label">Žádám o podmíněný odklad trestu pro </span><input class="f" placeholder="Jméno Příjmení" style="min-width:160px"><span class="line-label"> </span><input class="f" placeholder="Datum narození" style="min-width:110px"></div>`,SP,
    L('Dopustil se: ','trestný čin',220),SP,
    TA('Popis situace:','Napište popis situace...',3),SP,
    TA('Důkazní prostředky:','Napište důkazy...'),SP,
    S(`Pán má čistý trestný rejstřík a po čas výslechu spolupracoval.`),
    `<div class="line"><span class="line-label">Navrhovaný trest: </span><input class="f" placeholder="počet" style="min-width:45px"><span class="line-label"> rok(y) podmíněný trest</span></div>`,SP,
    SIG(),
  ].join('') },
  { name:"Souhlas se zadržením", code:"DOC-03", html: () => [
    S(`Vážený @Soudce @Statni zastupce`),SP,
    `<div class="line"><span class="line-label">Žádám o souhlas se zadržením na osobu </span><input class="f" placeholder="Jméno Příjmení" style="min-width:160px"><span class="line-label"> </span><input class="f" placeholder="Datum narození" style="min-width:110px"></div>`,SP,
    `<div class="line"><span class="line-label">Osoba je podezřelá ze spáchání </span><input class="f" placeholder="trestný čin" style="min-width:180px"></div>`,SP,
    TA('Popis události:','Datum, čas, místo, okolnosti...',3),SP,
    SIG(),
  ].join('') },
  { name:"Ozbrojená loupež", code:"DOC-04", html: () => [
    `<div class="line"><span class="line-label">**10-68 </span><input class="f" placeholder="XXXXX" style="min-width:80px"><span class="line-label"> (PC: </span><input class="f" placeholder="XXXX" style="min-width:65px"><span class="line-label">) – </span><input class="f" placeholder="DD.MM.YYYY" style="min-width:100px"><span class="line-label"> v </span><input class="f" placeholder="HH:MM" style="min-width:55px"><span class="line-label">**</span></div>`,SP,
    L('**Velitel akce:** ','jméno',160), L('**Vyjednávač:** ','jméno',160),SP,
    TA('**Rukojmí:**','Seznam rukojmí...'), SP,
    TA('**Suspeeti:**','Seznam podezřelých...'), SP,
    TA('**Postup vyjednavače/velitele:**','Popis postupu...',3),
  ].join('') },
  { name:"Drogy (10-14)", code:"DOC-05", html: () => [
    L('**Jméno příjmení:::** ','Jméno Příjmení',180),
    L('**DOB::** ','DD.MM.YYYY',110),SP,
    `<div class="line"><span class="line-label">**Droga:** </span><input class="f" placeholder="typ drogy" style="min-width:120px"><span class="line-label"> (typ drogy a množstvo)</span></div>`,SP,
    `<div class="line"><span class="line-label">**Situace:** </span><input class="f" placeholder="oblast" style="min-width:100px"><span class="line-label"> – </span><input class="f" placeholder="krátký popis" style="min-width:180px"></div>`,
  ].join('') },
  { name:"Přepadení osob", code:"DOC-06", html: () => [
    L('**Jméno a příjmení:** ','Jméno Příjmení',180),
    L('**Datum narození:** ','DD.MM.YYYY',110),SP,
    TA('**Výpověď poškozeného:**','Výpověď poškozeného...',3),SP,
    TA('**Odcizené věci:**','Seznam odcizených věcí...'),SP,
    L('**Zranění:** ','popis zranění',200),
  ].join('') },
  { name:"Výslech osoby", code:"DOC-07", html: () => [
    `<div class="line"><span class="line-label">Výslech suspecta/rukojmího/podezřelého/svědka z akce </span><input class="f" placeholder="název akce" style="min-width:100px"><span class="line-label"> v </span><input class="f" placeholder="čas a datum" style="min-width:130px"></div>`,SP,
    L('Jméno a příjmení: ','Jméno Příjmení',180),
    L('Datum narození: ','DD.MM.YYYY',110),SP,
    TA('Výslech:','Průběh výslechu...',4),SP,
    S(signatureLine()),
  ].join('') },
  { name:"Uzavření dálnice", code:"DOC-08", html: () => [
    `<div class="line"><span class="line-label">/pol Dálnice </span><input class="f" placeholder="XXX" style="min-width:55px"><span class="line-label"> je uzavřena mezi body </span><input class="f" placeholder="XXX" style="min-width:55px"><span class="line-label"> z důvodu </span><input class="f" placeholder="důvod" style="min-width:120px"><span class="line-label">.</span></div>`,
    S(`Uzavřená oblast by mohla být pro občany nebezpečná a mohli byste zde dojít k újmě, prosíme tedy, abyste do oblasti nevstupovali.`),
    S(`Dbejte výzev policie a použijte objízdné trasy. Jinak se vystavujete riziku trestního stíhání dle Trestního zákoníku SA, Část 2, Hlava 7, §59 – Neuposlechnutí výzvy úřední osoby.`),
  ].join('') },
  { name:"Uzavření oblasti", code:"DOC-09", html: () => [
    `<div class="line"><span class="line-label">/pol Oblast </span><input class="f" placeholder="XXX" style="min-width:80px"><span class="line-label"> je uzavřena z důvodu </span><input class="f" placeholder="důvod" style="min-width:150px"><span class="line-label">.</span></div>`,
    S(`Uzavřená oblast by mohla být pro občany nebezpečná a mohli byste zde dojít k újmě, prosíme tedy, abyste do oblasti nevstupovali a dbali výzev policie.`),
    S(`Jinak se vystavujete riziku trestního stíhání dle Trestního zákoníku SA, Část 2, Hlava 7, §59 – Neuposlechnutí výzvy úřední osoby.`),
  ].join('') },
];

let current = 0;

function setTab(i) {
  document.getElementById('doc-view').style.display = 'flex';
  document.getElementById('notes-view').style.display = 'none';
  current = i;
  document.querySelectorAll('.tab').forEach((t,idx) => { t.classList.remove('active'); t.classList.remove('active-notes'); });
  document.querySelectorAll('.tab')[i].classList.add('active');
  document.getElementById('doc-title').textContent = templates[i].name;
  document.getElementById('doc-code').textContent = templates[i].code;
  document.getElementById('template-output').innerHTML = templates[i].html();
  const btn = document.getElementById('copy-btn');
  btn.classList.remove('copied');
  document.getElementById('copy-label').textContent = 'Uložit a zkopírovat';
}

function autoResize(el) { el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }

function getFilledText() {
  const box = document.getElementById('template-output');
  let lines=[], cur='';
  function walk(node) {
    if (node.nodeType===Node.TEXT_NODE) { cur+=node.textContent; }
    else if (node.tagName==='INPUT') { cur+=node.value||node.placeholder; }
    else if (node.tagName==='TEXTAREA') {
      if (cur.trim()) { lines.push(cur); cur=''; }
      lines.push(node.value||node.placeholder);
    } else if (node.classList&&node.classList.contains('spacer')) {
      if (cur.trim()) { lines.push(cur); cur=''; }
      lines.push('');
    } else if (node.classList&&(node.classList.contains('line')||node.classList.contains('static'))) {
      cur=''; node.childNodes.forEach(walk); lines.push(cur); cur='';
    } else { node.childNodes.forEach(walk); }
  }
  box.childNodes.forEach(walk);
  if (cur.trim()) lines.push(cur);
  return lines.join('\n');
}

function copyText() {
  navigator.clipboard.writeText(getFilledText()).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.classList.add('copied');
    document.getElementById('copy-label').textContent = '✓ Zkopírováno';
    setTimeout(() => { btn.classList.remove('copied'); document.getElementById('copy-label').textContent='Uložit a zkopírovat'; }, 2500);
  });
}

function downloadText() {
  const text = getFilledText();
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=templates[current].name.replace(/\s+/g,'_')+'.txt';
  a.click(); URL.revokeObjectURL(url);
}

function resetFields() {
  document.querySelectorAll('.f,.fa').forEach(el => { el.value=''; if(el.tagName==='TEXTAREA') autoResize(el); });
}
</script>
</body>

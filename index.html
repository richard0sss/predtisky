header, .shell, #login-screen { position: relative; z-index: 2; }

/* ══════════════════════════════════
   LOGIN SCREEN
══════════════════════════════════ */
#login-screen {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: rgba(13,17,23,0.97);
}

.login-wrap {
  display: flex;
  width: 860px; max-width: 96vw;
  border: 1px solid var(--border2);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 24px 64px rgba(0,0,0,0.6);
}

.login-left {
  width: 300px; flex-shrink: 0;
  background: var(--bg-card);
  padding: 2.5rem 2rem;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-right: 1px solid var(--border2);
  text-align: center;
}

.login-left .shield {
  width: 72px; height: 72px;
  background: var(--blue);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; margin-bottom: 1.2rem;
  box-shadow: 0 0 0 8px rgba(56,139,253,0.12);
}

.login-left h2 {
  font-size: 18px; font-weight: 600; color: #fff;
  margin-bottom: 4px; letter-spacing: .02em;
}

.login-left p {
  font-size: 12px; color: var(--text2); line-height: 1.5;
}

.login-left .dept {
  margin-top: 1.5rem;
  font-family: var(--mono);
  font-size: 10px; color: var(--text3);
  letter-spacing: .1em; text-transform: uppercase;
  border-top: 1px solid var(--border2); padding-top: 1rem; width: 100%;
}

.login-right {
  flex: 1;
  background: var(--bg-base);
  padding: 2.5rem 2rem;
  display: flex; flex-direction: column; gap: 1rem;
}

.login-right h3 {
  font-size: 14px; font-weight: 500; color: var(--text2);
  text-transform: uppercase; letter-spacing: .08em;
  margin-bottom: 4px;
}

.lf { display: flex; flex-direction: column; gap: 5px; }
.lf label { font-size: 11px; color: var(--text2); font-weight: 500; letter-spacing: .04em; }

.lf input, .lf select {
  background: var(--bg-card);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--sans); font-size: 13px;
  padding: 8px 12px;
  outline: none;
  transition: border-color .15s;
  appearance: none; -webkit-appearance: none;
  width: 100%;
}
.lf input:focus, .lf select:focus { border-color: var(--blue); }
.lf input::placeholder { color: var(--text3); }

.lf .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.login-btn {
  width: 100%; padding: 10px;
  background: var(--blue);
  border: none; border-radius: 6px;
  color: #fff; font-family: var(--sans);
  font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background .15s;
  letter-spacing: .02em;
}
.login-btn:hover { background: #1f6feb; }

.auto-label {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
}
.auto-label input[type=checkbox] { accent-color: var(--blue); width: 14px; height: 14px; cursor: pointer; }
.auto-label span { font-size: 12px; color: var(--text2); }

#login-error { font-size: 11px; color: var(--red); display: none; }

/* ══════════════════════════════════
   MAIN APP
══════════════════════════════════ */
.shell {
  display: none;
  flex-direction: column;
  height: 100vh;
}

/* Top bar */
.topbar {
  height: 48px;
  background: var(--bg-base);
  border-bottom: 1px solid var(--border2);
  display: flex; align-items: center;
  padding: 0 1.5rem;
  gap: 1rem;
  flex-shrink: 0;
}

.topbar-logo {
  display: flex; align-items: center; gap: 8px;
}
.topbar-logo .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--blue);
  box-shadow: 0 0 6px var(--blue);
}
.topbar-logo span {
  font-family: var(--mono); font-size: 12px; color: var(--blue2);
  letter-spacing: .1em; text-transform: uppercase;
}

.topbar-sep { width: 1px; height: 20px; background: var(--border2); margin: 0 4px; }

.topbar-title {
  font-size: 13px; color: var(--text2); font-weight: 400;
}

.topbar-right {
  margin-left: auto;
  display: flex; align-items: center; gap: 12px;
}

.user-chip {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-card);

}

.logout-btn {

/* Main layout */
.main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: 230px; flex-shrink: 0;
  background: var(--bg-base);
  border-right: 2px solid rgba(77,158,247,0.15);

.tab {

.tab.active { background: var(--bg-active); color: var(--blue2); font-weight: 600; border-left-color: var(--blue); }

.tab-icon {
  width: 16px; height: 16px; flex-shrink: 0;

}

.tab-num {

.content-header {

  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: flex; align-items: baseline; gap: 10px;
}

.content-title {
  font-size: 15px; font-weight: 600; color: #fff;
}

.content-badge {
  font-family: var(--mono); font-size: 10px;
  color: var(--text3); background: var(--bg-card);
  border: 1px solid var(--border2);
  padding: 2px 8px; border-radius: 4px;
}

.template-area {
  flex: 1; overflow-y: auto;
  padding: 1.25rem 1.5rem;
}

.template-box {
  background: var(--bg-card);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 1.2rem 1.4rem;
  font-family: var(--mono); font-size: 13px;
  color: var(--text); line-height: 1;
}

.line { display: flex; align-items: baseline; min-height: 28px; flex-wrap: wrap; }
.spacer { height: 12px; width: 100%; flex-shrink: 0; }
.line-label { color: var(--text); white-space: pre; font-family: var(--mono); font-size: 13px; line-height: 1; }
.static { color: var(--text); font-family: var(--mono); font-size: 13px; line-height: 1.7; padding: 1px 0; width: 100%; }

.f {
  background: transparent; border: none;
  border-bottom: 1px solid rgba(56,139,253,0.4);

  transition: border-color .15s, background .15s; line-height: 1;
}
.f:focus { border-bottom-color: var(--blue2); background: rgba(56,139,253,0.06); }
.f::placeholder { color: rgba(56,139,253,0.3); font-style: italic; }

.fa {
  display: block; width: 100%;

}
.fa:focus { border-left-color: var(--blue2); background: rgba(56,139,253,0.08); }
.fa::placeholder { color: rgba(56,139,253,0.28); font-style: italic; }

/* Bottom bar */
.bottom-bar {
  padding: 0.75rem 1.5rem;

}

.copy-btn {

}
.copy-btn:hover { background: #1f6feb; }

}
.reset-btn:hover { border-color: var(--text2); color: var(--text); }

@media (max-width: 750px) {

}

</head>
<body>

<script>
let currentUser = { rank: '', fname: '', lname: '' };
function fullName() { return currentUser.fname + ' ' + currentUser.lname; }
function signatureLine() { return currentUser.rank + ' ' + currentUser.fname + ' ' + currentUser.lname; }

function doLogin() {
  const rank = document.getElementById('login-rank').value;
  const fname = document.getElementById('login-fname').value.trim();
  const lname = document.getElementById('login-lname').value.trim();
  const err = document.getElementById('login-error');
  if (!rank || !fname || !lname) { err.style.display = 'block'; return; }
  err.style.display = 'none';
  currentUser = { rank, fname, lname };
  if (document.getElementById('autologin-cb').checked) {
    localStorage.setItem('sasp_user', JSON.stringify(currentUser));
  } else {
    localStorage.removeItem('sasp_user');
  }
  showApp();
}

function doLogout() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('shell').style.display = 'none';
  document.getElementById('login-rank').value = currentUser.rank || '';
  document.getElementById('login-fname').value = currentUser.fname || '';
  document.getElementById('login-lname').value = currentUser.lname || '';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  const shell = document.getElementById('shell');
  shell.style.display = 'flex';

  const initials = (currentUser.fname[0]||'') + (currentUser.lname[0]||'');
  document.getElementById('user-avatar').textContent = initials.toUpperCase();
  document.getElementById('user-name').textContent = fullName();
  document.getElementById('user-rank').textContent = currentUser.rank;
  setTab(0);
}

window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('sasp_user');
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      document.getElementById('login-rank').value = currentUser.rank;
      document.getElementById('login-fname').value = currentUser.fname;
      document.getElementById('login-lname').value = currentUser.lname;
      document.getElementById('autologin-cb').checked = true;
      showApp();
    } catch(e) { localStorage.removeItem('sasp_user'); }
  }
});

// ── TEMPLATES ──
function L(label, placeholder, width) {
  return `<div class="line"><span class="line-label">${label}</span><input class="f" placeholder="${placeholder}" style="min-width:${width||120}px"></div>`;
}
const SP = `<div class="spacer"></div>`;
function S(text) { return `<div class="static">${text}</div>`; }
function TA(label, placeholder, rows) {
  const h = (rows||2)*22+12;
  return `<div class="static">${label}</div><textarea class="fa" placeholder="${placeholder}" style="min-height:${h}px" oninput="autoResize(this)"></textarea>`;
}
function SIG() {
  return `<div class="static">Děkuji,</div><div class="static">S pozdravem</div><div class="static">${signatureLine()}</div>`;
}

const templates = [
  {
    name: "Nesouhlas s trestem", code: "DOC-01",
    html: () => [
      S(`Vážený @Soudce / @Statni zastupce tímto žádám o vyjádření k rozhodnutí ve věci zkráceného řízení:`),
      SP,
      `<div class="line"><span class="line-label">Osoba </span><input class="f" placeholder="Jméno Příjmení" style="min-width:160px"><span class="line-label"> DOB: </span><input class="f" placeholder="DD.MM.YYYY" style="min-width:100px"><span class="line-label"> nesouhlasí s rozhodnutím státní ozbrojené složky ve věci zkráceného řízení pro </span><input class="f" placeholder="trestný čin" style="min-width:120px"></div>`,
      SP,
      `<div class="line"><span class="line-label">Výše uvedený(á) dne </span><input class="f" placeholder="datum" style="min-width:90px"><span class="line-label"> kolem </span><input class="f" placeholder="čas" style="min-width:60px"><span class="line-label"> vešel do klenotnictví se zbraní, kde rozbil výlohy a ukradl šperky, které si uložil do tašky. Po příjezdu SASP se dobrovolně vzdal a byl zadržen. Zbraň, kterou měl u sebe, nebyla registrována na jeho osobu a není ani držitelem zbrojního průkazu.</span></div>`,
      SP,
      TA('Důvod nesouhlasu s trestem:', 'Napište důvod nesouhlasu...'),
      SP,
      TA('Důkazní prostředky:', 'Napište důkazy...'),
      SP,
      `<div class="line"><span class="line-label">Výpis z rejstříku trestů: Výše uvedený byl již </span><input class="f" placeholder="počet" style="min-width:45px"><span class="line-label">x trestán pro </span><input class="f" placeholder="trestný čin" style="min-width:150px"></div>`,
      SP,
      SIG(),
    ].join('')
  },
  {
    name: "Podmíněný trest", code: "DOC-02",
    html: () => [
      S(`Vážený @Soudce @Statni zastupce @Captain`),
      SP,
      `<div class="line"><span class="line-label">Žádám o podmíněný odklad trestu pro </span><input class="f" placeholder="Jméno Příjmení" style="min-width:160px"><span class="line-label"> </span><input class="f" placeholder="Datum narození" style="min-width:110px"></div>`,
      SP,
      L('Dopustil se: ', 'trestný čin', 220),
      SP,
      TA('Popis situace:', 'Napište popis situace...', 3),
      SP,
      TA('Důkazní prostředky:', 'Napište důkazy...'),
      SP,
      S(`Pán má čistý trestný rejstřík a po čas výslechu spolupracoval.`),
      `<div class="line"><span class="line-label">Navrhovaný trest: </span><input class="f" placeholder="počet" style="min-width:45px"><span class="line-label"> rok(y) podmíněný trest</span></div>`,
      SP,
      SIG(),
    ].join('')
  },
  {
    name: "Souhlas se zadržením", code: "DOC-03",
    html: () => [
      S(`Vážený @Soudce @Statni zastupce`),
      SP,
      `<div class="line"><span class="line-label">Žádám o souhlas se zadržením na osobu </span><input class="f" placeholder="Jméno Příjmení" style="min-width:160px"><span class="line-label"> </span><input class="f" placeholder="Datum narození" style="min-width:110px"></div>`,
      SP,
      `<div class="line"><span class="line-label">Osoba je podezřelá ze spáchání </span><input class="f" placeholder="trestný čin" style="min-width:180px"></div>`,
      SP,
      TA('Popis události:', 'Datum, čas, místo, okolnosti...', 3),
      SP,
      SIG(),
    ].join('')
  },
  {
    name: "Ozbrojená loupež", code: "DOC-04",
    html: () => [
      `<div class="line"><span class="line-label">**10-68 </span><input class="f" placeholder="XXXXX" style="min-width:80px"><span class="line-label"> (PC: </span><input class="f" placeholder="XXXX" style="min-width:65px"><span class="line-label">) – </span><input class="f" placeholder="DD.MM.YYYY" style="min-width:100px"><span class="line-label"> v </span><input class="f" placeholder="HH:MM" style="min-width:55px"><span class="line-label">**</span></div>`,
      SP,
      L('**Velitel akce:** ', 'jméno', 160),
      L('**Vyjednávač:** ', 'jméno', 160),
      SP,
      TA('**Rukojmí:**', 'Seznam rukojmí...'),
      SP,
      TA('**Suspeeti:**', 'Seznam podezřelých...'),
      SP,
      TA('**Postup vyjednavače/velitele:**', 'Popis postupu...', 3),
    ].join('')
  },
  {
    name: "Drogy (10-14)", code: "DOC-05",
    html: () => [
      L('**Jméno příjmení:::** ', 'Jméno Příjmení', 180),
      L('**DOB::** ', 'DD.MM.YYYY', 110),
      SP,
      `<div class="line"><span class="line-label">**Droga:** </span><input class="f" placeholder="typ drogy" style="min-width:120px"><span class="line-label"> (typ drogy a množstvo)</span></div>`,
      SP,
      `<div class="line"><span class="line-label">**Situace:** </span><input class="f" placeholder="oblast" style="min-width:100px"><span class="line-label"> – </span><input class="f" placeholder="krátký popis" style="min-width:180px"></div>`,
      SP,

    ].join('')
  },
  {
    name: "Přepadení osob", code: "DOC-06",
    html: () => [
      L('**Jméno a příjmení:** ', 'Jméno Příjmení', 180),
      L('**Datum narození:** ', 'DD.MM.YYYY', 110),
      L('**Tel. číslo:** ', '+420 xxx xxx xxx', 150),
      L('**Email:** ', 'email@example.com', 180),
      SP,
      TA('**Výpověď poškozeného:**', 'Výpověď poškozeného...', 3),
      SP,
      TA('**Odcizené věci:**', 'Seznam odcizených věcí...'),
      SP,
      L('**Zranění:** ', 'popis zranění', 200),
    ].join('')
  },
  {
    name: "Výslech osoby", code: "DOC-07",
    html: () => [
      `<div class="line"><span class="line-label">Výslech suspecta/rukojmího/podezřelého/svědka z akce </span><input class="f" placeholder="název akce" style="min-width:100px"><span class="line-label"> v </span><input class="f" placeholder="čas a datum" style="min-width:130px"></div>`,
      SP,
      L('Jméno a příjmení: ', 'Jméno Příjmení', 180),
      L('Datum narození: ', 'DD.MM.YYYY', 110),
      L('Tel. číslo: ', '+420 xxx xxx xxx', 150),
      SP,
      TA('Výslech:', 'Průběh výslechu...', 4),
      SP,
      S(signatureLine()),
    ].join('')
  },
  {
    name: "Uzavření dálnice", code: "DOC-08",
    html: () => [
      `<div class="line"><span class="line-label">/pol Dálnice </span><input class="f" placeholder="XXX" style="min-width:55px"><span class="line-label"> je uzavřena mezi body </span><input class="f" placeholder="XXX" style="min-width:55px"><span class="line-label"> z důvodu </span><input class="f" placeholder="důvod" style="min-width:120px"><span class="line-label">.</span></div>`,
      SP,
      S(`Uzavřená oblast by mohla být pro občany nebezpečná a mohli byste zde dojít k újmě, prosíme tedy, abyste do oblasti nevstupovali.`),
      SP,
      S(`Dbejte výzev policie a použijte objízdné trasy. Jinak se vystavujete riziku trestního stíhání dle Trestního zákoníku SA, Část 2, Hlava 7, §59 – Neuposlechnutí výzvy úřední osoby.`),
    ].join('')
  },
];

let current = 0;

function setTab(i) {
  current = i;
  document.querySelectorAll('.tab').forEach((t, idx) => t.classList.toggle('active', idx === i));
  document.getElementById('doc-title').textContent = templates[i].name;
  document.getElementById('doc-code').textContent = templates[i].code;
  document.getElementById('template-output').innerHTML = templates[i].html();
  document.getElementById('copy-btn').classList.remove('success');
  document.getElementById('copy-label').textContent = 'Kopírovat do schránky';
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function getFilledText() {
  const box = document.getElementById('template-output');
  let lines = [], cur = '';
  function walk(node) {
    if (node.nodeType === Node.TEXT_NODE) { cur += node.textContent; }
    else if (node.tagName === 'INPUT') { cur += node.value || node.placeholder; }
    else if (node.tagName === 'TEXTAREA') {
      if (cur.trim()) { lines.push(cur); cur = ''; }
      lines.push(node.value || node.placeholder);
    } else if (node.classList && node.classList.contains('spacer')) {
      if (cur.trim()) { lines.push(cur); cur = ''; }
      lines.push('');
    } else if (node.classList && (node.classList.contains('line') || node.classList.contains('static'))) {
      cur = '';
      node.childNodes.forEach(walk);
      lines.push(cur);
      cur = '';
    } else { node.childNodes.forEach(walk); }
  }
  box.childNodes.forEach(walk);
  if (cur.trim()) lines.push(cur);
  return lines.join('\n');
}

function copyText() {
  const text = getFilledText();
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.classList.add('success');
    document.getElementById('copy-label').textContent = 'Zkopírováno!';
    setTimeout(() => {
      btn.classList.remove('success');
      document.getElementById('copy-label').textContent = 'Kopírovat do schránky';
    }, 2500);
  });
}

function resetFields() {
  document.querySelectorAll('.f, .fa').forEach(el => {
    el.value = '';
    if (el.tagName === 'TEXTAREA') autoResize(el);
  });
}
</script>

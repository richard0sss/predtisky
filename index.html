  border: 1px solid rgba(0,212,255,0.25);
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(0,212,255,0.08), 0 32px 80px rgba(0,0,0,0.7);
}

/* corner decorations */
.login-wrap::before,
.login-wrap::after {
  content: '';
  position: absolute;
  width: 16px; height: 16px;
  border-color: var(--gold);
  border-style: solid;
  z-index: 3;
}
.login-wrap::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
.login-wrap::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

.login-left {
  width: 280px; flex-shrink: 0;
  background: rgba(8,11,14,0.9);
  padding: 2.5rem 1.75rem;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-right: 1px solid rgba(0,212,255,0.15);
  text-align: center;
  gap: 0;
}

.login-badge {
  font-family: var(--mono);
  font-size: 11px; letter-spacing: .2em;
  color: var(--gold);
  border: 1px solid rgba(232,184,75,0.4);
  padding: 3px 12px; margin-bottom: 1.5rem;
  background: rgba(232,184,75,0.06);
}

.login-left h2 {
  font-family: var(--mono);
  font-size: 20px; font-weight: 400;
  color: #fff; letter-spacing: .1em;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.login-left p {
  font-size: 12px; color: var(--text2); line-height: 1.6; letter-spacing: .04em;
}

.login-separator {
  width: 100%; height: 1px;
  background: linear-gradient(to right, transparent, rgba(0,212,255,0.3), transparent);
  margin: 1.5rem 0;
}

.login-status {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; color: var(--green2);
  letter-spacing: .12em; text-transform: uppercase;
}
.login-status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green2);
  box-shadow: 0 0 6px var(--green2);
  animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

.login-right {
  flex: 1;
  background: rgba(13,17,23,0.95);
  padding: 2.5rem 2rem;
  display: flex; flex-direction: column; gap: 1.1rem;
}

.login-right h3 {
  font-size: 11px; color: var(--cyan);
  letter-spacing: .2em; text-transform: uppercase;
  border-bottom: 1px solid rgba(0,212,255,0.15);
  padding-bottom: 8px;
}

.lf { display: flex; flex-direction: column; gap: 5px; }
.lf label {
  font-size: 10px; color: var(--text2);
  letter-spacing: .12em; text-transform: uppercase;
}

.lf input, .lf select {
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--border2);
  border-radius: 2px;
  color: var(--text);
  font-family: var(--mono); font-size: 13px;
  padding: 8px 10px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
  appearance: none; -webkit-appearance: none;
  width: 100%;
}
.lf input:focus, .lf select:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 1px rgba(0,212,255,0.2);
}
.lf input::placeholder { color: var(--text3); }

.lf .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.login-btn {
  width: 100%; padding: 10px;
  background: transparent;
  border: 1px solid var(--gold);
  border-radius: 2px;
  color: var(--gold);
  font-family: var(--mono); font-size: 12px;
  letter-spacing: .16em; text-transform: uppercase;
  cursor: pointer; transition: all .15s;
  position: relative; overflow: hidden;
}
.login-btn::before {
  content: '';
  position: absolute; inset: 0;
  background: var(--gold);
  transform: translateX(-100%);
  transition: transform .2s;
  z-index: 0;
}
.login-btn:hover::before { transform: translateX(0); }
.login-btn:hover { color: #000; }
.login-btn span { position: relative; z-index: 1; }

.auto-label {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
}
.auto-label input[type=checkbox] { accent-color: var(--cyan); width: 13px; height: 13px; cursor: pointer; }
.auto-label span { font-size: 11px; color: var(--text2); letter-spacing: .04em; }

#login-error { font-size: 11px; color: var(--red); display: none; letter-spacing: .04em; }

/* ════════════════════════════
   APP SHELL
════════════════════════════ */
.shell {
  display: none;
  flex-direction: column;
  height: 100vh;
}

/* TOPBAR */
.topbar {
  height: 40px;
  background: var(--bg2);
  border-bottom: 1px solid rgba(0,212,255,0.15);
  display: flex; align-items: center;
  padding: 0 1rem;
  gap: 12px;
  flex-shrink: 0;
}

.topbar-brand {
  display: flex; align-items: center; gap: 8px;
}
.topbar-brand .shield-icon {
  width: 20px; height: 20px; color: var(--gold);
}
.topbar-brand .brand-text {
  font-size: 13px; color: var(--gold); letter-spacing: .12em; font-weight: 600;
}

.topbar-sep { width: 1px; height: 18px; background: var(--border2); }

.topbar-subtitle {
  font-size: 11px; color: var(--text2); letter-spacing: .06em;
  text-transform: uppercase;
}

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }

.online-indicator {
  display: flex; align-items: center; gap: 5px;
  font-size: 10px; color: var(--green2); letter-spacing: .1em;
}
.online-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green2); box-shadow: 0 0 5px var(--green2);
  animation: blink 2s infinite;
}

.user-display {
  display: flex; align-items: center; gap: 8px;
  border-left: 1px solid var(--border2); padding-left: 10px;
}
.user-initials {
  width: 24px; height: 24px; border-radius: 2px;
  background: rgba(0,212,255,0.15);
  border: 1px solid rgba(0,212,255,0.3);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; color: var(--cyan);
}
.user-text { display: flex; flex-direction: column; }
.user-name { font-size: 12px; color: var(--text); line-height: 1.2; }
.user-rank { font-size: 10px; color: var(--cyan); line-height: 1.2; }

.logout-btn {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text2); font-size: 10px; font-family: var(--mono);
  padding: 4px 10px; border-radius: 2px;
  cursor: pointer; transition: all .15s;
  letter-spacing: .08em; text-transform: uppercase;
}
.logout-btn:hover { border-color: var(--gold); color: var(--gold); }

/* MAIN */
.main { display: flex; flex: 1; overflow: hidden; }

/* SIDEBAR */
.sidebar {
  width: 200px; flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid rgba(0,212,255,0.1);
  display: flex; flex-direction: column;
  overflow-y: auto;
  padding: 1rem 0.5rem;
}

.sidebar-section {
  font-size: 9px; font-weight: 700;
  color: var(--text3); letter-spacing: .18em; text-transform: uppercase;
  padding: 0 8px; margin-bottom: 6px;
}

.tab {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px; border: none; border-left: 2px solid transparent;
  border-radius: 2px;
  background: transparent; color: var(--text2);
  font-family: var(--mono); font-size: 12px;
  cursor: pointer; text-align: left; transition: all .12s;
  width: 100%; margin-bottom: 1px; letter-spacing: .02em;
}
.tab:hover { background: rgba(0,212,255,0.05); color: var(--text); border-left-color: rgba(0,212,255,0.3); }
.tab.active { background: rgba(232,184,75,0.08); color: var(--gold2); border-left-color: var(--gold); }

.tab-num {
  font-size: 9px; color: var(--text3); min-width: 16px; flex-shrink: 0;
}
.tab.active .tab-num { color: var(--gold); }

/* CONTENT */
.content {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; background: var(--bg);
}

.content-header {
  padding: 1rem 1.5rem 0.75rem;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: flex; align-items: center; gap: 12px;
}

.content-title {
  font-size: 14px; font-weight: 600; color: var(--gold);
  letter-spacing: .08em; text-transform: uppercase;
}

.content-badge {
  font-size: 10px; color: var(--text3);
  border: 1px solid var(--border2);
  padding: 2px 8px; border-radius: 2px;
  letter-spacing: .1em;
}

.template-area {
  flex: 1; overflow-y: auto;
  padding: 1.25rem 1.5rem;
}

.template-box {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 3px;
  padding: 1.2rem 1.4rem;
  font-family: var(--mono); font-size: 13px;
  color: var(--text);
}

.line { display: flex; align-items: baseline; min-height: 26px; flex-wrap: wrap; }
.spacer { height: 10px; width: 100%; flex-shrink: 0; }
.line-label { color: var(--text); white-space: pre; font-family: var(--mono); font-size: 13px; line-height: 1; }
.static { color: var(--text); font-family: var(--mono); font-size: 13px; line-height: 1.75; padding: 1px 0; width: 100%; }

.f {
  background: transparent; border: none;
  border-bottom: 1px solid rgba(232,184,75,0.35);
  color: var(--gold2); font-family: var(--mono); font-size: 13px;
  padding: 0 3px 1px; outline: none; min-width: 60px; flex: 1;
  transition: border-color .15s; line-height: 1;
}
.f:focus { border-bottom-color: var(--gold); background: rgba(232,184,75,0.04); }
.f::placeholder { color: rgba(232,184,75,0.25); font-style: italic; }

.fa {
  display: block; width: 100%;
  background: transparent;
  border: none; border-left: 2px solid rgba(232,184,75,0.25);
  color: var(--gold2); font-family: var(--mono); font-size: 13px;
  padding: 4px 0 4px 10px; margin: 3px 0; outline: none;
  resize: none; min-height: 36px; line-height: 1.75;
  transition: border-color .15s; overflow: hidden;
}
.fa:focus { border-left-color: var(--gold); }
.fa::placeholder { color: rgba(232,184,75,0.25); font-style: italic; }

/* BOTTOM BAR – styled like SASP-calc */
.bottom-bar {
  padding: 0; flex-shrink: 0;
  border-top: 1px solid var(--border2);
  display: flex;
  background: var(--bg2);
}

.bar-btn {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px;
  background: transparent; border: none;
  font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  cursor: pointer; transition: all .15s;
  border-right: 1px solid var(--border2);
  position: relative; overflow: hidden;
}
.bar-btn:last-child { border-right: none; }

.bar-btn-save {
  color: var(--green2);
}
.bar-btn-save:hover { background: rgba(57,211,83,0.1); }

.bar-btn-clear {
  color: var(--red);
}
.bar-btn-clear:hover { background: rgba(255,68,68,0.1); }

.bar-btn-icon {
  width: 16px; height: 16px; flex-shrink: 0;
}

.bar-btn-save.copied { color: #fff; background: rgba(57,211,83,0.2); }

@media (max-width: 750px) {
  .login-left { display: none; }
  .main { flex-direction: column; }
  .sidebar { width: 100%; height: auto; flex-direction: row; flex-wrap: wrap; border-right: none; border-bottom: 1px solid var(--border2); }
  .tab { width: auto; }
  .content { min-height: 0; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-wrap">
    <div class="login-left">
      <div class="login-badge">S · A · S · P</div>
      <h2>Terminal</h2>
      <p>Secure Document Terminal<br>San Andreas State Police</p>
      <div class="login-separator"></div>
      <div class="login-status">
        <div class="login-status-dot"></div>
        System Online
      </div>
    </div>
    <div class="login-right">
      <h3>// Ověření identity</h3>
      <div class="lf">
        <label>Hodnost</label>
        <select id="login-rank">
          <option value="">— vyberte hodnost —</option>
          <option>Cadet</option>
          <option>Trainee</option>
          <option>Junior Trooper</option>
          <option>Trooper</option>
          <option>Detective I</option>
          <option>Senior Trooper</option>
          <option>Detective II</option>
          <option>Detective III</option>
          <option>Lead Senior Trooper</option>
          <option>Sergeant</option>
          <option>Sergeant II</option>
          <option>Lieutenant</option>
          <option>Captain</option>
        </select>
      </div>
      <div class="lf">
        <label>Identifikace</label>
        <div class="row2">
          <input type="text" id="login-fname" placeholder="Jméno">
          <input type="text" id="login-lname" placeholder="Příjmení">
        </div>
      </div>
      <button class="login-btn" onclick="doLogin()"><span>[ Přihlásit se ]</span></button>
      <label class="auto-label">
        <input type="checkbox" id="autologin-cb">
        <span>Zapamatovat a přihlásit automaticky</span>
      </label>
      <div id="login-error">▶ Vyplňte všechna pole.</div>
    </div>
  </div>
</div>

<!-- SHELL -->
<div class="shell" id="shell">
  <div class="topbar">
    <div class="topbar-brand">
      <svg class="shield-icon" viewBox="0 0 20 20" fill="none">
        <path d="M10 2L3 5v5c0 4.5 3 8.5 7 9.5 4-1 7-5 7-9.5V5L10 2z" stroke="currentColor" stroke-width="1.5" fill="rgba(232,184,75,0.1)"/>
      </svg>
      <span class="brand-text">SASP</span>
    </div>
    <div class="topbar-sep"></div>
    <div class="topbar-subtitle">Předtisky &amp; Dokumenty</div>
    <div class="topbar-right">
      <div class="online-indicator">
        <div class="online-dot"></div>
        ONLINE
      </div>
      <div class="user-display">
        <div class="user-initials" id="user-avatar">–</div>
        <div class="user-text">
          <div class="user-name" id="user-name">–</div>
          <div class="user-rank" id="user-rank">–</div>
        </div>
      </div>
      <button class="logout-btn" onclick="doLogout()">[ Změnit účet ]</button>
    </div>
  </div>

  <div class="main">
    <nav class="sidebar">
      <div class="sidebar-section">// Dokumenty</div>
      <button class="tab active" onclick="setTab(0)"><span class="tab-num">01</span>Nesouhlas s trestem</button>
      <button class="tab" onclick="setTab(1)"><span class="tab-num">02</span>Podmíněný trest</button>
      <button class="tab" onclick="setTab(2)"><span class="tab-num">03</span>Souhlas se zadržením</button>
      <button class="tab" onclick="setTab(3)"><span class="tab-num">04</span>Ozbrojená loupež</button>
      <button class="tab" onclick="setTab(4)"><span class="tab-num">05</span>Drogy (10-14)</button>
      <button class="tab" onclick="setTab(5)"><span class="tab-num">06</span>Přepadení osob</button>
      <button class="tab" onclick="setTab(6)"><span class="tab-num">07</span>Výslech osoby</button>
      <button class="tab" onclick="setTab(7)"><span class="tab-num">08</span>Uzavření dálnice</button>
    </nav>

    <section class="content">
      <div class="content-header">
        <div class="content-title" id="doc-title"></div>
        <div class="content-badge" id="doc-code"></div>
      </div>
      <div class="template-area">
        <div class="template-box" id="template-output"></div>
      </div>
      <div class="bottom-bar">
        <button class="bar-btn bar-btn-save" id="copy-btn" onclick="copyText()">
          <svg class="bar-btn-icon" viewBox="0 0 16 16" fill="none">
            <rect x="5" y="5" width="9" height="10" rx="1" stroke="currentColor" stroke-width="1.3"/>
            <path d="M11 5V3a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h2" stroke="currentColor" stroke-width="1.3"/>
          </svg>
          <span id="copy-label">Uložit a zkopírovat</span>
        </button>
        <button class="bar-btn bar-btn-clear" onclick="resetFields()">
          <svg class="bar-btn-icon" viewBox="0 0 16 16" fill="none">
            <path d="M2 4h12M6 4V2h4v2M5 4v9a1 1 0 001 1h4a1 1 0 001-1V4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          Nový případ
        </button>
      </div>
    </section>
  </div>
</div>

<script>
let currentUser = { rank: '', fname: '', lname: '' };
function fullName() { return currentUser.fname + ' ' + currentUser.lname; }
function signatureLine() { return currentUser.rank + ' ' + currentUser.fname + ' ' + currentUser.lname; }

function doLogin() {
  const rank = document.getElementById('login-rank').value;
  const fname = document.getElementById('login-fname').value.trim();
  const lname = document.getElementById('login-lname').value.trim();
  const err = document.getElementById('login-error');
  if (!rank || !fname || !lname) { err.style.display = 'block'; return; }
  err.style.display = 'none';
  currentUser = { rank, fname, lname };
  if (document.getElementById('autologin-cb').checked) {
    localStorage.setItem('sasp_user', JSON.stringify(currentUser));
  } else {
    localStorage.removeItem('sasp_user');
  }
  showApp();
}

function doLogout() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('shell').style.display = 'none';
  document.getElementById('login-rank').value = currentUser.rank || '';
  document.getElementById('login-fname').value = currentUser.fname || '';
  document.getElementById('login-lname').value = currentUser.lname || '';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('shell').style.display = 'flex';
  const initials = (currentUser.fname[0]||'') + (currentUser.lname[0]||'');
  document.getElementById('user-avatar').textContent = initials.toUpperCase();
  document.getElementById('user-name').textContent = fullName();
  document.getElementById('user-rank').textContent = currentUser.rank;
  setTab(0);
}

window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('sasp_user');
  if (saved) {
    try {
      currentUser = JSON.parse(saved);
      document.getElementById('login-rank').value = currentUser.rank;
      document.getElementById('login-fname').value = currentUser.fname;
      document.getElementById('login-lname').value = currentUser.lname;
      document.getElementById('autologin-cb').checked = true;
      showApp();
    } catch(e) { localStorage.removeItem('sasp_user'); }
  }
});

function L(label, placeholder, width) {
  return `<div class="line"><span class="line-label">${label}</span><input class="f" placeholder="${placeholder}" style="min-width:${width||120}px"></div>`;
}
const SP = `<div class="spacer"></div>`;
function S(text) { return `<div class="static">${text}</div>`; }
function TA(label, placeholder, rows) {
  const h = (rows||2)*22+12;
  return `<div class="static">${label}</div><textarea class="fa" placeholder="${placeholder}" style="min-height:${h}px" oninput="autoResize(this)"></textarea>`;
}
function SIG() {
  return `<div class="static">Děkuji,</div><div class="static">S pozdravem</div><div class="static">${signatureLine()}</div>`;
}

const templates = [
  {
    name: "Nesouhlas s trestem", code: "DOC-01",
    html: () => [
      S(`Vážený @Soudce / @Statni zastupce tímto žádám o vyjádření k rozhodnutí ve věci zkráceného řízení:`),
      SP,
      `<div class="line"><span class="line-label">Osoba </span><input class="f" placeholder="Jméno Příjmení" style="min-width:160px"><span class="line-label"> DOB: </span><input class="f" placeholder="DD.MM.YYYY" style="min-width:100px"><span class="line-label"> nesouhlasí s rozhodnutím státní ozbrojené složky ve věci zkráceného řízení pro </span><input class="f" placeholder="trestný čin" style="min-width:120px"></div>`,
      SP,
      `<div class="line"><span class="line-label">Výše uvedený(á) dne </span><input class="f" placeholder="datum" style="min-width:90px"><span class="line-label"> kolem </span><input class="f" placeholder="čas" style="min-width:60px"><span class="line-label"> vešel do klenotnictví se zbraní, kde rozbil výlohy a ukradl šperky, které si uložil do tašky. Po příjezdu SASP se dobrovolně vzdal a byl zadržen. Zbraň, kterou měl u sebe, nebyla registrována na jeho osobu a není ani držitelem zbrojního průkazu.</span></div>`,
      SP,
      TA('Důvod nesouhlasu s trestem:', 'Napište důvod nesouhlasu...'),
      SP,
      TA('Důkazní prostředky:', 'Napište důkazy...'),
      SP,
      `<div class="line"><span class="line-label">Výpis z rejstříku trestů: Výše uvedený byl již </span><input class="f" placeholder="počet" style="min-width:45px"><span class="line-label">x trestán pro </span><input class="f" placeholder="trestný čin" style="min-width:150px"></div>`,
      SP,
      SIG(),
    ].join('')
  },
  {
    name: "Podmíněný trest", code: "DOC-02",
    html: () => [
      S(`Vážený @Soudce @Statni zastupce @Captain`),
      SP,
      `<div class="line"><span class="line-label">Žádám o podmíněný odklad trestu pro </span><input class="f" placeholder="Jméno Příjmení" style="min-width:160px"><span class="line-label"> </span><input class="f" placeholder="Datum narození" style="min-width:110px"></div>`,
      SP,
      L('Dopustil se: ', 'trestný čin', 220),
      SP,
      TA('Popis situace:', 'Napište popis situace...', 3),
      SP,
      TA('Důkazní prostředky:', 'Napište důkazy...'),

let current = 0;

function setTab(i) {
  current = i;
  document.querySelectorAll('.tab').forEach((t, idx) => t.classList.toggle('active', idx === i));
  document.getElementById('doc-title').textContent = templates[i].name;
  document.getElementById('doc-code').textContent = templates[i].code;
  document.getElementById('template-output').innerHTML = templates[i].html();
  const btn = document.getElementById('copy-btn');
  btn.classList.remove('copied');
  document.getElementById('copy-label').textContent = 'Uložit a zkopírovat';
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function getFilledText() {
  const box = document.getElementById('template-output');
  let lines = [], cur = '';
  function walk(node) {
    if (node.nodeType === Node.TEXT_NODE) { cur += node.textContent; }
    else if (node.tagName === 'INPUT') { cur += node.value || node.placeholder; }
    else if (node.tagName === 'TEXTAREA') {
      if (cur.trim()) { lines.push(cur); cur = ''; }
      lines.push(node.value || node.placeholder);
    } else if (node.classList && node.classList.contains('spacer')) {
      if (cur.trim()) { lines.push(cur); cur = ''; }
      lines.push('');
    } else if (node.classList && (node.classList.contains('line') || node.classList.contains('static'))) {
      cur = '';
      node.childNodes.forEach(walk);
      lines.push(cur);
      cur = '';
    } else { node.childNodes.forEach(walk); }
  }
  box.childNodes.forEach(walk);
  if (cur.trim()) lines.push(cur);
  return lines.join('\n');
}

function copyText() {
  const text = getFilledText();
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.classList.add('copied');
    document.getElementById('copy-label').textContent = '✓ Zkopírováno';
    setTimeout(() => {
      btn.classList.remove('copied');
      document.getElementById('copy-label').textContent = 'Uložit a zkopírovat';
    }, 2500);
  });
}

function resetFields() {
  document.querySelectorAll('.f, .fa').forEach(el => {
    el.value = '';
    if (el.tagName === 'TEXTAREA') autoResize(el);
  });
}

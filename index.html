<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SASP · Předtisky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0f;
    --bg2: #111418;
    --bg3: #181c22;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --gold: #e8b84b;
    --gold2: #f5d07a;
    --text: #c8cdd6;
    --text2: #7a8291;
    --green: #3ddc97;
    --red: #e84b4b;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Rajdhani', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  /* Header */
  header {
    border-bottom: 1px solid var(--gold);
    padding: 0 2rem;
    background: var(--bg2);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 1.5rem;
    height: 56px;
  }

  .badge {
    background: var(--gold);
    color: #0a0c0f;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    letter-spacing: .1em;
  }

  .header-title {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--gold);
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--green);
    letter-spacing: .08em;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: .3; }
  }

  /* Main layout */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem;
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 1.5rem;
    min-height: calc(100vh - 56px);
  }

  /* Sidebar tabs */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .sidebar-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text2);
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 0 8px;
    margin-bottom: 8px;
    margin-top: 4px;
  }

  .tab {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 1px solid transparent;
    border-radius: 4px;
    background: transparent;
    color: var(--text2);
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    transition: all .15s;
    letter-spacing: .03em;
  }

  .tab:hover {
    background: var(--bg3);
    color: var(--text);
    border-color: var(--border);
  }

  .tab.active {
    background: rgba(232,184,75,.08);
    border-color: rgba(232,184,75,.3);
    color: var(--gold2);
  }

  .tab-num {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text2);
    min-width: 18px;
  }

  .tab.active .tab-num {
    color: var(--gold);
  }

  /* Content area */
  .content {
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .content-header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }

  .content-title {
    font-family: var(--mono);
    font-size: 16px;
    color: var(--gold);
    letter-spacing: .06em;
    text-transform: uppercase;
  }

  .content-subtitle {
    font-size: 13px;
    color: var(--text2);
    font-family: var(--mono);
  }

  /* Template output */
  .template-box {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 1.25rem 1.5rem;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.9;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    position: relative;
    min-height: 120px;
  }

  .template-box .highlight {
    color: var(--gold2);
    background: rgba(232,184,75,.1);
    padding: 0 2px;
    border-radius: 2px;
  }

  /* Copy button */
  .copy-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 3px;
    transition: all .15s;
    align-self: flex-start;
  }

  .copy-btn:hover {
    background: rgba(232,184,75,.1);
  }

  .copy-btn.success {
    border-color: var(--green);
    color: var(--green);
    background: rgba(61,220,151,.08);
  }

  .copy-icon {
    width: 14px;
    height: 14px;
  }

  /* Raw text display */
  .raw-section {
    margin-top: .5rem;
  }

  .raw-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text2);
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  /* Footer */
  footer {
    border-top: 1px solid var(--border);
    padding: 1rem 2rem;
    text-align: center;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text2);
    letter-spacing: .06em;
  }

  /* Responsive */
  @media (max-width: 700px) {
    main {
      grid-template-columns: 1fr;
      padding: 1rem;
    }
    .sidebar {
      flex-direction: row;
      flex-wrap: wrap;
    }
    .tab {
      font-size: 12px;
      padding: 7px 10px;
    }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="badge">SASP</div>
    <div class="header-title">Secure Document Terminal &nbsp;·&nbsp; Předtisky</div>
    <div class="status">
      <div class="status-dot"></div>
      ONLINE
    </div>
  </div>
</header>

<main>
  <nav class="sidebar">
    <div class="sidebar-label">// Dokumenty</div>
    <button class="tab active" onclick="setTab(0)"><span class="tab-num">01</span> Nesouhlas s trestem</button>
    <button class="tab" onclick="setTab(1)"><span class="tab-num">02</span> Podmíněný trest</button>
    <button class="tab" onclick="setTab(2)"><span class="tab-num">03</span> Souhlas se zadržením</button>
    <button class="tab" onclick="setTab(3)"><span class="tab-num">04</span> Ozbrojená loupež</button>
    <button class="tab" onclick="setTab(4)"><span class="tab-num">05</span> Drogy (10-14)</button>
    <button class="tab" onclick="setTab(5)"><span class="tab-num">06</span> Přepadení osob</button>
  </nav>

  <section class="content">
    <div class="content-header">
      <div class="content-title" id="doc-title">Nesouhlas s trestem</div>
      <div class="content-subtitle" id="doc-code">DOC-01</div>
    </div>

    <div class="template-box" id="template-output"></div>

    <button class="copy-btn" id="copy-btn" onclick="copyText()">
      <svg class="copy-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="5" width="9" height="10" rx="1" stroke="currentColor" stroke-width="1.2"/>
        <path d="M11 5V3a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h2" stroke="currentColor" stroke-width="1.2"/>
      </svg>
      <span id="copy-label">Kopírovat do schránky</span>
    </button>
  </section>
</main>

<footer>SAN ANDREAS STATE POLICE &nbsp;·&nbsp; SECURE DOCUMENT TERMINAL &nbsp;·&nbsp; CLASSIFIED</footer>

<script>
const templates = [
  {
    name: "Nesouhlas s trestem",
    code: "DOC-01",
    text: `Vážený @Soudce / @Statni zastupce tímto žádám o vyjádření k rozhodnutí ve věci zkráceného řízení:

Osoba xxx DOB:  nesouhlasí a rozhodnutím státní ozbrojené složky ve věci zkráceného řízení pro xx

Výše uvedený(á) dne xx kolem xx vešel do klenotnictví se zbraní, kde rozbil výlohy a ukradl šperky, které si uložil do tašky. Po příjezdu SASP se dobrovolně vzdal a byl zadržen. Zbraň, kterou měl u sebe, nebyla registrována na jeho osobu a není ani držitelem zbrojního průkazu

Důvod nesouhlasu a trestem:

Důkazní prostředky:

Výpis z rejstříku trestů:  Výše uvedený byl již xx trestán pro xx

Děkuji,
S pozdravem
Sgt. Fidelius Marcelius`
  },
  {
    name: "Podmíněný trest",
    code: "DOC-02",
    text: `Vážený @Soudce @Statni zastupce @Captain

Žádám o podmíněný odklad treatu pro \`Jméno Příjmení Datum narození osoby\`

Dopustil se: xxx

Popis situace:

Důkazní prostředky:

Pán má čistý trestný rejstřík a po čas výslechu spolupracoval.
Navrhovaný treast: xx rok podmíněný treast

Děkuji,
S pozdravem
Sgt. Fidelius Marcelius`
  },
  {
    name: "Souhlas se zadržením",
    code: "DOC-03",
    text: `Vážený @Soudce @Statni zastupce

Žádám o souhlas se zadržením na osobu \`Jméno Příjmení Datum narození osoby\`

osoba je podezřelá ze spáchání xx

Popis události: dne 5.3.2022 kolem 20:32 hodin obdrželi dispatch call o možném pěstování marihuany na PC 7215 kancelář č. 4. V kanceláři bylo nalezeno celkem 530g marihuany(25 rostlin, 6 sáčků). Osoba měla v daný moment kancelář v pronájmu, avšak už momentálně nemá. Osoba má čistý trestní rejstřík.

Děkuji,
S pozdravem
Sgt. Fidelius Marcelius`
  },
  {
    name: "Ozbrojená loupež",
    code: "DOC-04",
    text: `**10-68 XXXXX (PC: XXXX) – XX.XX.2026 v XX:XX**

**Velitel akce:**
**Vyjednávač:**

**Rukojmí:**

**Suspeeti:**

**Postup vyjednavače/velitele:**`
  },
  {
    name: "Drogy (10-14)",
    code: "DOC-05",
    text: `**Jméno příjmení:::**
**DOB::**

**Droga:** (typ drogy a množstvo)

**Situace:** (oblast a krátky popis)

- potrebné každú osobu nafotiť (mug shot)
- označiť @GIU`
  },
  {
    name: "Přepadení osob",
    code: "DOC-06",
    text: `**Jméno a příjmení:**
**Datum narození:**
**Tel. číslo:**
**Email:**

**Výpověď poškozeného:**

**Odcizené věci:**

**Zranění:**`
  }
];

let current = 0;

function setTab(i) {
  current = i;
  document.querySelectorAll('.tab').forEach((t, idx) => {
    t.classList.toggle('active', idx === i);
  });
  document.getElementById('doc-title').textContent = templates[i].name;
  document.getElementById('doc-code').textContent = templates[i].code;
  document.getElementById('template-output').textContent = templates[i].text;
  const btn = document.getElementById('copy-btn');
  btn.classList.remove('success');
  document.getElementById('copy-label').textContent = 'Kopírovat do schránky';
}

function copyText() {
  navigator.clipboard.writeText(templates[current].text).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.classList.add('success');
    document.getElementById('copy-label').textContent = 'Zkopírováno!';
    setTimeout(() => {
      btn.classList.remove('success');
      document.getElementById('copy-label').textContent = 'Kopírovat do schránky';
    }, 2500);
  });
}

setTab(0);
</script>
</body>
</html>
